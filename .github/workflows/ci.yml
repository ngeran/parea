name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Strict TypeScript across shared, server, client, admin.
      - run: npm run typecheck
      # WCAG contrast gate for all three client themes (Phase 6).
      - run: npm run check:contrast -w @parea/client
      # Worker API incl. the authorization matrix (real D1/DOs via workerd).
      - run: npm test -w @parea/server
