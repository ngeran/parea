name: Deploy server
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Worker serves the admin dashboard from apps/admin/dist.
      - run: npm run build:admin
      - name: Apply D1 migrations
        working-directory: apps/server
        run: npx wrangler d1 migrations apply together --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker (API + admin assets)
        working-directory: apps/server
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Secrets (OTP_PEPPER, TWILIO_*, EXPO_ACCESS_TOKEN) are set once with
      # `wrangler secret put` — see docs/DEPLOY.md. Production flags
      # (OTP_MOCK=0, real database_id, ALLOWED_ORIGINS) live in
      # wrangler.jsonc [env.production] at launch time.
