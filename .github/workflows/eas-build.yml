name: EAS build (iOS + Android)
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build production clients
        working-directory: apps/client
        run: eas build --platform all --profile production --non-interactive
      # Store submission stays manual at first (docs/STORE-LISTINGS.md):
      # `eas submit --platform ios` / `--platform android` once the developer
      # accounts exist.
